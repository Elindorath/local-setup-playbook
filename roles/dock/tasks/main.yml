---
- name: Remove all items from the Dock
  ansible.builtin.shell: "$(brew --prefix dockutil)/bin/dockutil --remove all --no-restart"
  changed_when: true
  notify: killall dock

- name: Set the default Dock items
  ansible.builtin.shell: "$(brew --prefix dockutil)/bin/dockutil --add {{ item | quote }} --no-restart"
  with_items: "{{ dock_applications }}"
  changed_when: true
  notify: killall dock
